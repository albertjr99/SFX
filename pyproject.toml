[project]
name = "sfx"
version = "2.0.0"
description = "Sistema de produção da Subgerência de Fixação (SFX)"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions/fe1823cbdd2f_initial_schema.py", "migrations/versions/ecf042e679b9_add_conferencia_documental_fields.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["I"]
"tests/test_periodo.py" = ["SIM102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:sfx.*"]
