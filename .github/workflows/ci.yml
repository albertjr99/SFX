name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Testes
        run: pytest
      - name: Migrações aplicam do zero
        env:
          SFX_ENV: development
          DATABASE_URL: sqlite:////tmp/ci.db
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi demo popular --meses 1
          flask --app wsgi db downgrade ecf042e679b9
          flask --app wsgi db upgrade

  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sfx:ci .
